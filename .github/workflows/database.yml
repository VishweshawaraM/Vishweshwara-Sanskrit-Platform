name: Database

# Run migrations (and optionally the seed) against Supabase from a GitHub
# runner. This exists so the Acharya never needs a terminal: set the
# DATABASE_URL secret in the browser, then press "Run workflow".
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also run the seed (first time only)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the connection string looks right
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # GitHub runners are IPv4-only; Supabase direct connections are IPv6.
          # The session pooler (port 5432 on *.pooler.supabase.com) is required.
          case "$DATABASE_URL" in
            *pooler.supabase.com:5432*) echo "Session pooler detected — good." ;;
            *pooler.supabase.com:6543*) echo "::warning::Transaction pooler (6543) detected. Migrations need the SESSION pooler on port 5432." ;;
            *db.*.supabase.co*) echo "::error::Direct connection detected. GitHub runners cannot reach it (IPv6 only). Use the Session pooler string." ; exit 1 ;;
            *) echo "Non-Supabase host — continuing." ;;
          esac

      - name: Test the connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db-check.mjs

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      - name: Seed
        if: ${{ inputs.seed }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/seed.ts

      - name: Summary
        run: |
          echo "### Database is ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 22 tables applied to Supabase." >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.seed }}" = "true" ]; then
            echo "Seed ran — check the log above for the two demo logins, then change both passwords." >> $GITHUB_STEP_SUMMARY
          fi
